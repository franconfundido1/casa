:root {
  color-scheme: dark;
  --fondo: #000000;
  --texto: #FFFFFF;
  --texto-2: #8E8E93;
  --texto-3: #48484A;
  --linea: #3A3A3C;
  --gris-lleno: #2C2C2E;
  --borrar: #FF453A;
  --velo: rgba(44, 44, 46, .6);

  --letra: "League Spartan", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --letra-enorme: 700 44px/1.1 var(--letra);
  --letra-titulo-grande: 700 40px/1.1 var(--letra);
  --letra-titulo: 700 30px/1.15 var(--letra);
  --letra-numero: 600 36px/1 var(--letra);
  --letra-encabezado: 600 18px/24px var(--letra);
  --letra-cuerpo: 500 18px/24px var(--letra);
  --letra-secundaria: 400 16px/20px var(--letra);
  --letra-seccion: 400 15px/20px var(--letra);
  --letra-nota: 400 14px/18px var(--letra);
  --letra-pestana: 500 12px/14px var(--letra);

  --esp-1: 4px; --esp-2: 8px; --esp-3: 12px; --esp-4: 16px;
  --esp-5: 20px; --esp-6: 24px; --esp-7: 32px; --esp-8: 40px;
  --margen: 20px;
  --toque: 44px;
  --alto-boton: 56px;
  --alto-pastilla: 48px;
  --alto-fila: 68px;
  --circulo: 30px;
  --circulo-opcion: 56px;
  --circulo-grande: 120px;
  --icono: 24px;
  --radio-hoja: 38px;
  --radio-capsula: 999px;
  --trazo: 1px;
  --trazo-estado: 2px;

  --curva-ios: cubic-bezier(.32, .72, 0, 1);
  --t-hoja: 300ms;
  --t-corta: 200ms;
  --t-tarea: 250ms;

  --arriba: env(safe-area-inset-top, 0px);
  --abajo: env(safe-area-inset-bottom, 0px);
}
/* Instalada (iOS 26): el iPhone ya termina la pantalla de la app arriba de la barra de inicio.
   Si además se suma la zona segura de abajo, se cuenta 2 veces y queda una franja negra.
   Así que instalada, lo fijo abajo (la barra de pestañas, las hojas, «Empezar») no suma la zona segura; en Safari, sí. */
@media (display-mode: standalone) {
  :root { --abajo: 0px; }
}

/* Que se sienta app: sin selección, sin resaltado al tocar, sin menú al mantener apretado, sin rebote ni barra de desplazamiento */
* { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
[hidden] { display: none !important; }
html, body {
  background: var(--fondo);
  color: var(--texto);
  font: var(--letra-cuerpo);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
  overflow: hidden;
}
/* La cabecera, la pantalla y la barra de pestañas se reparten el alto: nada queda debajo de otra cosa. */
body { position: fixed; inset: 0; display: flex; flex-direction: column; }
input, textarea { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
svg.ic { width: var(--icono); height: var(--icono); flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
@keyframes fundido { from { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Componentes de docs/diseno.md que ya usa la app. Los demás se suman cuando una pantalla los necesite (están en bocetos/sistema.css). */

/* Cabecera fija: el título en minúscula, grande, con una línea fina abajo (como «hábitos») */
.titulo {
  flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-4);
  padding: calc(var(--arriba) + var(--esp-5)) var(--margen) var(--esp-4);
  border-bottom: var(--trazo) solid var(--linea);
}
.titulo h1 { font: var(--letra-titulo-grande); }
.titulo small { display: block; font: var(--letra-seccion); color: var(--texto-2); margin-top: var(--esp-1); min-height: 20px; }
.titulo .cambia { animation: fundido var(--t-corta) ease-out; }

/* Pantallas: solo una a la vista; lo único que se desplaza */
.pantallas { flex: 1; min-height: 0; position: relative; }
.pantalla {
  position: absolute; inset: 0;
  overflow-y: auto; overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  padding: var(--esp-5) 0 var(--esp-6);
  animation: fundido var(--t-corta) ease-out;
}

/* Secciones y notas */
.seccion { margin-bottom: var(--esp-7); }
.seccion > h2 { font: var(--letra-seccion); color: var(--texto-2); padding: 0 var(--margen) var(--esp-1); }

/* Fila de datos (sin círculo): nombre a la izquierda, valor gris a la derecha */
.fila-dato {
  display: flex; align-items: center; justify-content: space-between; gap: var(--esp-4);
  min-height: var(--alto-fila); padding: 0 var(--margen);
}
.fila-dato .valor { font: var(--letra-secundaria); color: var(--texto-2); text-align: right; }
/* Fila que es un botón (Ajustes): el texto a la izquierda y el ícono a la derecha; el separador como en las listas */
.fila-boton { width: 100%; text-align: left; position: relative; transition: opacity 100ms; }
.fila-boton:active { opacity: .6; }
.fila-boton + .fila-boton::before { content: ""; position: absolute; top: 0; left: var(--margen); right: var(--margen); border-top: var(--trazo) solid var(--linea); }
.fila-boton svg { color: var(--texto-2); }
.nota-ajustes { font: var(--letra-nota); color: var(--texto-2); padding: var(--esp-1) var(--margen) 0; min-height: 18px; }
.texto-copia { font: var(--letra-secundaria); color: var(--texto-2); padding: var(--esp-4) 0 var(--esp-6); }

/* Barra de pestañas: plana, abajo, pegada a la barra de inicio (zona segura contada 1 vez) */
.pestanas {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--esp-2);
  padding: var(--esp-2) var(--esp-4) max(var(--esp-2), calc(var(--abajo) - 10px));
  border-top: var(--trazo) solid var(--linea); background: var(--fondo);
}
.pestanas button {
  height: 52px; border-radius: var(--radio-capsula);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--texto-2); font: var(--letra-pestana);
  transition: background var(--t-corta), color var(--t-corta);
}
.pestanas svg { width: 26px; height: 26px; }
.pestanas .lleno { display: none; }
.pestanas button[aria-current="page"] { background: var(--texto); color: var(--fondo); }
.pestanas button[aria-current="page"] .lleno { display: block; }
.pestanas button[aria-current="page"] .contorno { display: none; }

/* Botón de ícono suelto (el + del título): se ve solo el ícono de contorno; el toque es de 44 px */
.boton-icono {
  width: var(--toque); height: var(--toque); flex: none; margin-right: -8px;
  display: grid; place-items: center; color: var(--texto); transition: opacity 100ms;
}
.boton-icono:active { opacity: .5; }
.boton-icono svg { width: 32px; height: 32px; }
/* Botón redondo (el × de la hoja): lleno de gris oscuro con borde fino */
.boton-circulo {
  width: var(--toque); height: var(--toque); border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--gris-lleno); border: var(--trazo) solid var(--linea); color: var(--texto);
  transition: transform 100ms;
}
.boton-circulo:active { transform: scale(.92); }
.boton-circulo svg { width: 20px; height: 20px; }

/* Fila de tarea: directo sobre el negro, con mucho aire; el separador empieza después del círculo */
.lista { animation: fundido var(--t-corta) ease-out; }
.fila {
  display: flex; align-items: center; gap: var(--esp-3);
  min-height: var(--alto-fila); padding: 0 var(--margen) 0 calc(var(--margen) - 7px);
  position: relative; width: 100%; text-align: left;
  transition: opacity 100ms;
}
.fila:active { opacity: .6; }
.fila + .fila::before {
  content: ""; position: absolute; top: 0; right: var(--margen); left: calc(var(--margen) + var(--circulo) + var(--esp-3));
  border-top: var(--trazo) solid var(--linea);
}
.fila .texto { flex: 1; padding: var(--esp-3) 0; min-width: 0; }
.fila .nombre, .fila .linea { display: block; }
.fila .nombre { font: var(--letra-cuerpo); transition: color var(--t-corta); }
.fila .linea { font: var(--letra-secundaria); color: var(--texto-2); margin-top: 2px; }
/* Una de 1 vez atrasada: «de ayer» o «hace N días» en blanco, para que se vea dentro del blanco y negro */
.fila .linea .atraso { color: var(--texto); font-weight: 600; }

/* Círculo de estado, como los días de hábitos: lo sin hacer, gris oscuro lleno; se distingue por relleno, aro e ícono */
.estado {
  width: var(--toque); height: var(--toque); flex: none;
  display: grid; place-items: center;
}
.estado i {
  width: var(--circulo); height: var(--circulo); border-radius: 50%;
  background: var(--gris-lleno); border: var(--trazo-estado) solid var(--gris-lleno); display: grid; place-items: center;
  position: relative; overflow: hidden; color: var(--fondo);
  transition: background var(--t-corta), border-color var(--t-corta);
}
.estado i svg { position: absolute; width: 60%; height: 60%; opacity: 0; transition: opacity var(--t-corta); }
[data-estado="toca"] .estado i { border-color: var(--texto); }
[data-estado="hecha"] .estado i { background: var(--texto); border-color: var(--texto); animation: rebote var(--t-tarea); }
[data-estado="hecha"] .estado i .i-check { opacity: 1; }
/* A medias: aro blanco y la mitad llena; salteada: gris oscuro con la flecha gris (lo único que brilla es el blanco) */
.estado i::after { content: ""; position: absolute; inset: 0 50% 0 0; background: var(--texto); transform: scaleX(0); transform-origin: left; transition: transform var(--t-corta); }
[data-estado="a-medias"] .estado i { border-color: var(--texto); animation: rebote var(--t-tarea); }
[data-estado="a-medias"] .estado i::after { transform: scaleX(1); }
[data-estado="salteada"] .estado i { color: var(--texto-2); animation: rebote var(--t-tarea); }
[data-estado="salteada"] .estado i .i-salteada { opacity: 1; }
[data-estado="hecha"] .nombre, [data-estado="salteada"] .nombre, [data-estado="no"] .nombre { color: var(--texto-2); }
/* En las listas, el ícono de la tarea va adentro del círculo, chico y del color del aro (blanco si toca, gris si no);
   hecha, salteada y a medias lo cambian por el ✓, la flecha o la mitad. 1 sola cosa por fila. */
.fila .estado i .i-tarea { width: 55%; height: 55%; opacity: 1; color: var(--texto-2); }
.fila[data-estado="toca"] .estado i .i-tarea { color: var(--texto); }
.fila[data-estado="hecha"] .estado i .i-tarea, .fila[data-estado="salteada"] .estado i .i-tarea, .fila[data-estado="a-medias"] .estado i .i-tarea { opacity: 0; }
@keyframes rebote { 50% { transform: scale(1.15); } }

/* Pastillas para elegir: lo elegido, blanco lleno con letra negra; lo demás, contorno fino gris */
.pastillas { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--esp-3); }
.pastillas button {
  height: var(--alto-pastilla); border-radius: var(--radio-capsula);
  border: var(--trazo) solid var(--linea); color: var(--texto);
  font: var(--letra-encabezado);
  transition: background var(--t-corta), color var(--t-corta), border-color var(--t-corta), transform 100ms;
}
.pastillas button[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--fondo); }
.pastillas button:active { transform: scale(.95); }

/* Contador: − de contorno, + lleno; el número grande en el medio */
.contador { display: flex; align-items: center; justify-content: center; gap: var(--esp-5); }
.contador button {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  border: var(--trazo) solid var(--linea); color: var(--texto);
  transition: background var(--t-corta), color var(--t-corta), border-color var(--t-corta), transform 100ms;
}
.contador button[data-mas] { background: var(--texto); border-color: var(--texto); color: var(--fondo); }
.contador button svg { width: 20px; height: 20px; }
.contador button:active { transform: scale(.92); }
.contador button[disabled] { background: none; border-color: var(--linea); color: var(--texto-3); pointer-events: none; }
.contador .cifra { min-width: 64px; text-align: center; }
.contador .cifra b { display: block; font: var(--letra-numero); }
.contador .cifra span { display: block; font: var(--letra-nota); color: var(--texto-2); margin-top: var(--esp-1); min-height: 18px; }
.cambia { animation: fundido 150ms ease-out; }

/* Botones */
.boton {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: var(--alto-boton); border-radius: var(--radio-capsula);
  font: var(--letra-encabezado); background: var(--texto); color: var(--fondo);
  border: var(--trazo) solid var(--texto);
  transition: background var(--t-corta), color var(--t-corta), border-color var(--t-corta), transform 100ms;
}
.boton:active { transform: scale(.97); }
/* Apagado: solo contorno, como «Crear hábito» */
.boton[disabled] { background: none; border-color: var(--linea); color: var(--texto-2); pointer-events: none; }
.boton-texto {
  min-height: var(--toque); padding: 0 var(--esp-4);
  font: var(--letra-secundaria); font-weight: 500; color: var(--texto-2);
  transition: opacity 100ms, color var(--t-corta);
}
.boton-texto:active { opacity: .5; }
.boton-texto.borrar { color: var(--borrar); }

/* Hoja: sube desde abajo, negra, con el borde fino; cada hoja lleva su velo justo después (así se apilan 2) */
.velo {
  position: fixed; inset: 0; z-index: 20; background: var(--velo);
  opacity: 0; pointer-events: none; transition: opacity var(--t-hoja) ease;
}
.hoja {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0;
  top: calc(var(--arriba) + var(--esp-3));
  background: var(--fondo); border-radius: var(--radio-hoja) var(--radio-hoja) 0 0;
  border-top: var(--trazo) solid var(--linea);
  transform: translateY(105%); transition: transform var(--t-hoja) var(--curva-ios);
  display: flex; flex-direction: column;
  padding-bottom: max(var(--esp-4), var(--abajo));
}
.hoja.abierta { transform: none; }
.hoja.abierta + .velo { opacity: 1; pointer-events: auto; }
.hoja-arriba {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--esp-4) var(--margen) 0; min-height: 60px;
}
.hoja-cuerpo { flex: 1; overflow-y: auto; overscroll-behavior: none; padding: 0 var(--margen); }
/* Hoja de tarea, como «nuevo hábito» */
/* El círculo de la tarea con su ícono; el lápiz avisa que se toca para cambiarlo */
.firma { position: relative; width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center;
  background: var(--texto); color: var(--fondo); transition: transform 100ms; }
.firma:active { transform: scale(.95); }
.firma > svg { width: 38px; height: 38px; }
.firma .lapiz { position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--texto); border: 2px solid var(--fondo); display: grid; place-items: center; }
.firma .lapiz svg { width: 15px; height: 15px; }

.nombre-tarea {
  display: block; width: 100%; background: none; border: 0; outline: 0; text-align: center;
  font: var(--letra-titulo); padding: var(--esp-4) 0 var(--esp-2); caret-color: var(--texto);
}
.nombre-tarea::placeholder { color: var(--texto-3); }
.rayita { width: 56px; height: 2px; border-radius: 1px; background: var(--linea); margin: 0 auto var(--esp-6); }
.bloque-hoja { margin-bottom: var(--esp-6); }
.cabeza { display: flex; align-items: center; gap: var(--esp-2); font: var(--letra-seccion); color: var(--texto-2); margin-bottom: var(--esp-3); }
.cabeza svg { width: 20px; height: 20px; }
.bloque-hoja .pastillas { margin-bottom: var(--esp-4); }
/* «Elegir» día: una pastilla con el calendario del iPhone encima, invisible (tocarla lo abre) */
.elegir-fecha {
  position: relative; display: grid; place-items: center; height: var(--alto-pastilla); border-radius: var(--radio-capsula);
  border: var(--trazo) solid var(--linea); color: var(--texto); font: var(--letra-encabezado);
  transition: background var(--t-corta), color var(--t-corta), border-color var(--t-corta);
}
.elegir-fecha[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--fondo); }
.elegir-fecha input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; -webkit-appearance: none; appearance: none; }
.contadores { display: flex; justify-content: center; gap: var(--esp-6); }
.contadores .contador { gap: var(--esp-2); }
.contadores .contador button { width: var(--toque); height: var(--toque); }
.contadores .contador .cifra { min-width: 52px; }
.pie { padding: var(--esp-3) var(--margen) 0; display: flex; flex-direction: column; align-items: center; gap: var(--esp-1); }

/* Hoja para elegir el ícono, encima de la de la tarea */
.hoja.chica { top: auto; z-index: 23; }
.hoja.chica + .velo { z-index: 22; }
.grilla-iconos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--esp-2); padding: var(--esp-4) 0 var(--esp-2); }
.grilla-iconos button {
  height: 72px; border-radius: var(--esp-5); border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--esp-2);
  font: var(--letra-nota); color: var(--texto-2); transition: border-color var(--t-corta), color var(--t-corta), transform 100ms;
}
.grilla-iconos button svg { width: 34px; height: 34px; color: var(--texto); }
.grilla-iconos button:active { transform: scale(.95); }
.grilla-iconos button[aria-pressed="true"] { border-color: var(--texto); color: var(--texto); font-weight: 600; }
/* Hoy (bocetos/hoy.html): las 3 de hoy arriba; «tengo» fijo abajo, arriba de la barra de pestañas */
.pantalla-hoy { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.lista-hoy { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: none; padding: var(--esp-5) 0 var(--esp-4); }
.lista-hoy .nada { font: var(--letra-secundaria); color: var(--texto-2); padding: var(--esp-2) var(--margen); }

.tengo { flex: none; padding: var(--esp-5) var(--margen) var(--esp-4); border-top: var(--trazo) solid var(--linea); }
.tengo .opciones { margin-bottom: var(--esp-4); }

/* Círculos para elegir (los minutos): el elegido, blanco lleno con letra negra; los demás, contorno fino gris */
.opciones { display: flex; justify-content: space-between; }
.opciones button {
  width: var(--circulo-opcion); height: var(--circulo-opcion); border-radius: 50%;
  border: var(--trazo) solid var(--linea); color: var(--texto); font: var(--letra-encabezado);
  transition: background var(--t-corta), color var(--t-corta), border-color var(--t-corta), transform 100ms;
}
.opciones button[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--fondo); }
.opciones button:active { transform: scale(.95); }
/* En los minutos que no alcanzan para ninguna tarea: apagado, no se puede elegir */
.opciones button[disabled] { color: var(--texto-3); border-color: var(--gris-lleno); pointer-events: none; }

/* Tarea en curso */
.cuenta { font: var(--letra-secundaria); color: var(--texto-2); }
.curso { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 var(--margen); overflow: hidden; text-align: center; }
.tarea { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;
  transition: transform var(--t-tarea) var(--curva-ios), opacity var(--t-tarea); }
.tarea.sale { transform: translateX(-40%); opacity: 0; }
.tarea.entra { transform: translateX(40%); opacity: 0; transition: none; }
.tarea h3 { font: var(--letra-enorme); }
.tarea p { font: var(--letra-secundaria); font-size: 20px; color: var(--texto-2); margin-top: var(--esp-2); }
.tarea .estado { width: auto; height: auto; margin-top: var(--esp-8); }
.tarea .estado i { --circulo: var(--circulo-grande); border-width: 3px; transition: background var(--t-corta), border-color var(--t-corta), transform 100ms; }
.tarea .estado i svg { width: 50%; height: 50%; }
/* El ícono de la tarea, grande y blanco, adentro del círculo; al marcarla, deja lugar al ✓, la flecha o la mitad */
.tarea .estado i .i-tarea { width: 46%; height: 46%; color: var(--texto); opacity: 0; z-index: 1; }
.tarea[data-estado="toca"] .estado i .i-tarea { opacity: 1; }
.tarea[data-estado="toca"] .estado:active i { transform: scale(.94); }
.otras { display: flex; justify-content: center; gap: var(--esp-6); }
.otras button[disabled], .tarea .estado[disabled] { pointer-events: none; }

.fin { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; text-align: left; animation: fundido var(--t-corta); }
.fin h3 { font: var(--letra-titulo); padding: 0 0 var(--esp-5); text-align: center; }
.fin .fila { padding-left: 0; }
.fin .fila:active { opacity: 1; }
.fin .fila + .fila::before { left: calc(var(--circulo) + var(--esp-5)); right: 0; }
.fin + .boton { margin-bottom: var(--esp-2); }
</style>

<script>
'use strict';
// Fechas en días locales (Argentina, UTC−3). Funciones puras: reciben las fechas como parámetro.
// Un día se escribe 'AAAA-MM-DD'. Nunca se cuentan días con milisegundos de la hora: solo días de calendario.

const DIA_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

// 'AAAA-MM-DD' → número de día (días desde 1970-01-01). Error si no es un día válido.
function numeroDeDia(dia) {
  const m = DIA_RE.exec(dia);
  if (!m) throw new Error('día inválido: ' + dia);
  const [a, mes, d] = [+m[1], +m[2], +m[3]];
  const ms = Date.UTC(a, mes - 1, d);
  const f = new Date(ms);
  if (f.getUTCFullYear() !== a || f.getUTCMonth() !== mes - 1 || f.getUTCDate() !== d) throw new Error('día inválido: ' + dia);
  return ms / 86400000;
}

// Días de calendario de «desde» a «hasta» (negativo si «hasta» es antes).
function diasEntre(desde, hasta) {
  return numeroDeDia(hasta) - numeroDeDia(desde);
}

// El día que queda n días después (o antes, con n negativo).
function sumarDias(dia, n) {
  const f = new Date((numeroDeDia(dia) + n) * 86400000);
  const dos = x => String(x).padStart(2, '0');
  return `${f.getUTCFullYear()}-${dos(f.getUTCMonth() + 1)}-${dos(f.getUTCDate())}`;
}

// El día local de un momento (un Date), según la zona horaria del dispositivo.
function diaLocal(momento) {
  const dos = n => String(n).padStart(2, '0');
  return `${momento.getFullYear()}-${dos(momento.getMonth() + 1)}-${dos(momento.getDate())}`;
}

const DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// 'AAAA-MM-DD' → «miércoles 18 de noviembre».
function fechaLarga(dia) {
  const n = numeroDeDia(dia);
  const f = new Date(n * 86400000);
  return `${DIAS_SEMANA[f.getUTCDay()]} ${f.getUTCDate()} de ${MESES[f.getUTCMonth()]}`;
}

if (typeof module === 'object') module.exports = { diasEntre, sumarDias, diaLocal, fechaLarga };
// El estado guardado (localStorage, clave 'casa-v1'). Puro: recibe el texto guardado y devuelve el estado listo para usar.
// Cada cambio en la forma de guardar sube VERSION y suma en MIGRACIONES cómo pasar de la versión anterior a la nueva.
// Las migraciones no se cambian nunca después de publicadas: llevan sus datos adentro.

const VERSION = 4;

// MIGRACIONES[n]: datos de la versión n → datos de la versión n + 1.
const MIGRACIONES = {
  // 1 → 2: las 9 tareas de arranque (docs/vision.md) y el historial, vacío.
  // Cada tarea: minutos que lleva, cada cuántos días toca (min a max) y su ícono. Nunca hechas: tocan hoy.
  1: d => ({
    ...d,
    tareas: [
      { id: 'cama', nombre: 'Hacer la cama', icono: 'bed', minutos: 3, min: 1, max: 1 },
      { id: 'platos', nombre: 'Lavar los platos', icono: 'bowl-food', minutos: 10, min: 1, max: 1 },
      { id: 'ordenar-ropa', nombre: 'Ordenar la ropa', icono: 't-shirt', minutos: 10, min: 2, max: 2 },
      { id: 'barrer', nombre: 'Barrer', icono: 'broom', minutos: 10, min: 3, max: 3 },
      { id: 'verduleria', nombre: 'Verdulería', icono: 'carrot', minutos: 20, min: 3, max: 4 },
      { id: 'lavar-ropa', nombre: 'Lavar la ropa', icono: 'washing-machine', minutos: 5, min: 3, max: 4 },
      { id: 'trapo', nombre: 'Pasar el trapo', icono: 'drop', minutos: 20, min: 7, max: 7 },
      { id: 'bano', nombre: 'Limpiar el baño', icono: 'bathtub', minutos: 20, min: 7, max: 7 },
      { id: 'super', nombre: 'Súper', icono: 'shopping-cart', minutos: 60, min: 7, max: 7 },
    ],
    historial: [],
  }),
  // 2 → 3: las 3 de hoy (se eligen la 1.ª vez que se abre la app en el día). El historial suma «a-medias» y «salteada».
  2: d => ({ ...d, las3: null }),
  // 3 → 4: llegan las tareas de 1 vez ({ unaVez: true, fecha: 'AAAA-MM-DD' } en vez de min y max). Lo guardado no cambia;
  // el número nuevo evita que una versión vieja de la app (o una copia) lea tareas que no entiende.
  3: d => ({ ...d }),
};

function estadoNuevo(version = VERSION, migraciones = MIGRACIONES) {
  return migrar({ app: 'casa', version: 1 }, version, migraciones);
}

// Lleva unos datos ya leídos a la versión actual.
function migrar(datos, version = VERSION, migraciones = MIGRACIONES) {
  let d = datos;
  while (d.version < version) {
    const paso = migraciones[d.version];
    if (!paso) throw new Error('falta la migración de la versión ' + d.version);
    d = { ...paso(d), version: d.version + 1 };
  }
  return d;
}

// Texto guardado → { estado, roto }. «roto» es true si había algo que no se pudo leer (se guarda aparte, no se pierde).
// Datos de una versión más nueva que esta app se dejan como están.
function cargar(texto, version = VERSION, migraciones = MIGRACIONES) {
  if (texto === null || texto === undefined || texto === '') return { estado: estadoNuevo(version, migraciones), roto: false };
  let datos;
  try { datos = JSON.parse(texto); } catch (e) { return { estado: estadoNuevo(version, migraciones), roto: true }; }
  const valido = datos && typeof datos === 'object' && datos.app === 'casa' && Number.isInteger(datos.version) && datos.version >= 1;
  if (!valido) return { estado: estadoNuevo(version, migraciones), roto: true };
  if (datos.version > version) return { estado: datos, roto: false };
  return { estado: migrar(datos, version, migraciones), roto: false };
}

if (typeof module === 'object') module.exports = { VERSION, MIGRACIONES, estadoNuevo, migrar, cargar };
// Las tareas: cuándo tocan, qué tan vencidas están y los cambios que hace el usuario. Funciones puras:
// reciben «hoy» ('AAAA-MM-DD') como parámetro y devuelven datos nuevos, sin tocar los que reciben.
const fechasT = typeof module === 'object' ? require('./fechas.js') : { diasEntre, sumarDias };

// La última vez que se hizo, o null si nunca. Se lee el historial en orden: una fecha cargada a mano («ajuste»,
// que puede ser null = nunca) reemplaza lo anterior; cada «hecha» la sube si es más reciente.
function ultimaVez(historial, id) {
  let ultima = null;
  for (const h of historial) {
    if (h.tarea !== id) continue;
    if (h.que === 'ajuste') ultima = h.dia;
    else if (h.que === 'hecha' && (ultima === null || h.dia > ultima)) ultima = h.dia;
  }
  return ultima;
}

// Días desde la última vez (null si nunca se hizo).
function diasDesde(ultima, hoy) {
  return ultima === null ? null : fechasT.diasEntre(ultima, hoy);
}

// Toca: si nunca se hizo, o si pasaron al menos el mínimo de días.
function toca(tarea, ultima, hoy) {
  const d = diasDesde(ultima, hoy);
  return d === null || d >= tarea.min;
}

// Atrasada: pasaron más días que el máximo.
function atrasada(tarea, ultima, hoy) {

    .sort((a, b) => (b.v - a.v) || (a.t.minutos - b.t.minutos) || a.t.nombre.localeCompare(b.t.nombre, 'es'))

// Un grupo de filas, sin título: el círculo (aro, gris, ✓) y la línea (la fecha, el atraso) ya dicen qué es cada uno.
function seccionFilas(grupo, filas) {
  return filas.length ? `<section class="seccion" data-grupo="${grupo}"><div>${filas.join('')}</div></section>` : '';
}

function pintarTareas() {
  const hoy = hoyLocal();
  const g = agrupar(estado.tareas, estado.historial, hoy);
  const conEstado = t => estadoDelDia(estado.historial, t.id, hoy) || 'toca';
  listaTareas.innerHTML = '<div class="lista">' +
    seccionFilas('para hoy', paraHoyUnaVez(estado.tareas, estado.historial, hoy).map(t => filaTarea(t, conEstado(t), lineaUnaVez(t, hoy)))) +
    seccionFilas('tocan', g.tocan.map(t => filaTarea(t, conEstado(t)))) +
    seccionFilas('más adelante', g.adelante.map(t => filaTarea(t, 'no'))) +
    seccionFilas('próximas', proximasUnaVez(estado.tareas, estado.historial, hoy).map(t => filaTarea(t, 'no', `${cuandoTexto(t.fecha, hoy)} · ${t.minutos} min`))) +
    seccionFilas('hechas hoy', g.hechas.map(t => filaTarea(t, 'hecha'))) +
    '</div>';
}

// Tocar el círculo marca hecha (o deshace la de hoy); tocar la fila abre la hoja.
listaTareas.addEventListener('click', e => {
  const fila = e.target.closest('.fila');
  if (!fila) return;
  const tarea = estado.tareas.find(t => t.id === fila.dataset.id);
  if (!tarea) return;
  if (e.target.closest('[data-circulo]')) { tocarCirculo(fila, tarea); return; }
  abrirHojaTarea(tarea);
});

// ---- Controles de la hoja

// Contador − y +, con la lista de valores posibles. Devuelve get, set y la forma de cambiar los límites.
function contador(el, { valores, unidad, mostrar, alCambiar }) {
  el.innerHTML = `<button data-menos aria-label="Menos">${ic('minus-bold')}</button>` +
    `<div class="cifra"><b class="num"></b><span></span></div>` +
    `<button data-mas aria-label="Más">${ic('plus-bold')}</button>`;
  const menos = el.querySelector('[data-menos]'), mas = el.querySelector('[data-mas]'), cifra = el.querySelector('.cifra');
  let lista = valores, valor = valores[0];
  const pintar = (avisar = true) => {
    cifra.querySelector('b').textContent = mostrar ? mostrar(valor) : valor;
    cifra.querySelector('span').textContent = typeof unidad === 'function' ? unidad(valor) : unidad;
    cifra.classList.remove('cambia'); void cifra.offsetWidth; cifra.classList.add('cambia');
    menos.disabled = valor <= lista[0];
    mas.disabled = valor >= lista[lista.length - 1];
    if (avisar && alCambiar) alCambiar(valor);
  };
  menos.onclick = () => { valor = [...lista].reverse().find(v => v < valor) ?? valor; pintar(); };
  mas.onclick = () => { valor = lista.find(v => v > valor) ?? valor; pintar(); };
  return {
    get: () => valor,
    set: (v, avisar = false) => { if (!lista.includes(v)) lista = [...lista, v].sort((a, b) => a - b); valor = v; pintar(avisar); },
    limites: nuevos => { lista = nuevos; if (!lista.includes(valor)) valor = lista.find(v => v >= valor) ?? lista[lista.length - 1]; pintar(false); },
  };
}

const desdeHasta = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
// Minutos: de a 1 hasta 10, de a 5 hasta 60 y después de a 15 o 30.
const VALORES_MINUTOS = [...desdeHasta(1, 10), 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 75, 90, 120, 150, 180];
const VALORES_DIAS = desdeHasta(1, 60);
// Última vez: nunca (-1), hoy (0), ayer (1), y hasta 60 días atrás. Arranca en «nunca»: con el + se llega rápido a «hace 2 días».
const NUNCA = -1;
const VALORES_ULTIMA = [NUNCA, ...desdeHasta(0, 60)];

// ---- La hoja de tarea, como «nuevo hábito»

const hojaTarea = document.getElementById('hoja-tarea');
const hojaIconos = document.getElementById('hoja-iconos');
const nombreTarea = document.getElementById('nombre-tarea');
const guardarBtn = document.getElementById('guardar-tarea');
const borrarBtn = document.getElementById('borrar-tarea');
const firma = document.getElementById('firma');
const grilla = document.getElementById('grilla-iconos');
const modoEl = document.getElementById('modo');
const fechaEl = document.getElementById('fecha-unavez');
const fechaElegir = document.getElementById('fecha-elegir');
let enEdicion = null, icono = 'check-circle', modo = 'cada', fechaUnaVez = null, original = '', ultimaOriginal = NUNCA, armando = false;

const cMinutos = contador(document.getElementById('c-minutos'), { valores: VALORES_MINUTOS, unidad: 'minutos', alCambiar: revisar });
const cDesde = contador(document.getElementById('c-desde'), {
  valores: VALORES_DIAS, unidad: n => (modo === 'cada' ? (n === 1 ? 'día' : 'días') : 'desde'),
  alCambiar: () => { ajustarHasta(); revisar(); },
});
const cHasta = contador(document.getElementById('c-hasta'), { valores: VALORES_DIAS, unidad: 'hasta', alCambiar: () => { revisar(); } });
const cUltima = contador(document.getElementById('c-ultima'), {
  valores: VALORES_ULTIMA, alCambiar: revisar,
  mostrar: v => (v === NUNCA ? 'nunca' : v === 0 ? 'hoy' : v === 1 ? 'ayer' : v),
  unidad: v => (v >= 2 ? 'días atrás' : ''),
});

// Con «Entre», el máximo es siempre mayor que el mínimo.
function ajustarHasta() {
  cHasta.limites(desdeHasta(cDesde.get() + 1, 61));
}

function tareaDeLaHoja() {
  const base = { id: enEdicion ? enEdicion.id : 't' + Date.now().toString(36), nombre: nombreTarea.value, icono, minutos: cMinutos.get() };
  if (modo === 'unavez') return { ...base, unaVez: true, fecha: fechaUnaVez };
  const min = cDesde.get();
  return { ...base, min, max: modo === 'entre' ? cHasta.get() : min };
}
const firmaDe = t => JSON.stringify([t.nombre.trim(), t.icono, t.minutos, t.unaVez ? t.fecha : [t.min, t.max]]);

// «Guardar» se prende cuando la tarea está completa y cambió algo.
function revisar() {
  if (armando) return;
  const t = tareaDeLaHoja();
  const cambioUltima = modo !== 'unavez' && cUltima.get() !== ultimaOriginal;
  guardarBtn.disabled = !tareaValida(t) || (firmaDe(t) === original && !cambioUltima);
}

// 1 vez: el día, con «Hoy», «Mañana» o «Elegir» (el calendario del iPhone); un día elegido se ve en la pastilla.
const DIAS_CORTOS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
function pintarFecha() {
  const hoy = hoyLocal(), manana = sumarDias(hoy, 1);
  const cual = fechaUnaVez === hoy ? 'hoy' : fechaUnaVez === manana ? 'manana' : 'elegir';
  fechaEl.querySelectorAll('[data-op]').forEach(b => b.setAttribute('aria-pressed', b.dataset.op === cual));
  const f = new Date(fechaUnaVez + 'T12:00:00');
  document.getElementById('texto-elegir').textContent = cual === 'elegir' ? `${DIAS_CORTOS[f.getDay()]} ${f.getDate()}` : 'Elegir';
  fechaElegir.min = hoy;
  fechaElegir.value = fechaUnaVez;
}
fechaEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b) return;
  fechaUnaVez = b.dataset.op === 'hoy' ? hoyLocal() : sumarDias(hoyLocal(), 1);
  pintarFecha();
  revisar();
});
fechaElegir.addEventListener('change', () => {
  if (!fechaElegir.value) return;
  fechaUnaVez = fechaElegir.value < hoyLocal() ? hoyLocal() : fechaElegir.value;
  pintarFecha();
  revisar();
});


function pintarModo() {
  modoEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.op === modo));
  // 1 vez: el día en vez de la frecuencia, y sin «última vez»
  const unaVez = modo === 'unavez';
  fechaEl.hidden = !unaVez;
  document.getElementById('contadores-frec').hidden = unaVez;
  document.getElementById('bloque-ultima').hidden = unaVez;
  if (unaVez) { if (!fechaUnaVez) fechaUnaVez = hoyLocal(); pintarFecha(); }
  document.getElementById('c-hasta').hidden = modo === 'cada';
  cDesde.set(cDesde.get()); // la unidad cambia entre «días» y «desde»
  ajustarHasta();
}
modoEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b || b.dataset.op === modo) return;
  modo = b.dataset.op;
  pintarModo();
  revisar();
});

function pintarIcono() {
  firma.innerHTML = ic(icono + '-fill') + `<span class="lapiz">${ic('pencil-simple-fill')}</span>`;
  grilla.innerHTML = ICONOS_TAREA.map(([id, nombre]) =>
    `<button data-id="${id}" aria-pressed="${id === icono}" aria-label="${nombre}">${ic(id + '-fill')}</button>`).join('');
}
firma.onclick = () => abrirHoja(hojaIconos);
grilla.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  icono = b.dataset.id;
  pintarIcono();
  revisar();
  setTimeout(() => cerrarHoja(hojaIconos), 150);
});

function abrirHoja(h) { h.classList.add('abierta'); }
function cerrarHoja(h) { h.classList.remove('abierta'); }

// t: la tarea a editar (o null para una nueva). unaVezHoy: la nueva arranca en «1 vez · hoy» (el «+» de Hoy).
function abrirHojaTarea(t, { unaVezHoy = false } = {}) {
  armando = true;
  enEdicion = t || null;
  const base = t || (unaVezHoy ? { nombre: '', icono: 'check-circle', minutos: 10, unaVez: true, fecha: hoyLocal() }
    : { nombre: '', icono: 'check-circle', minutos: 10, min: 3, max: 3 });
  nombreTarea.value = base.nombre;
  icono = base.icono;
  modo = base.unaVez ? 'unavez' : base.min === base.max ? 'cada' : 'entre';
  fechaUnaVez = base.unaVez ? base.fecha : null;
  cMinutos.set(base.minutos);
  cDesde.set(base.unaVez ? 3 : base.min);
  ajustarHasta();
  cHasta.set(!base.unaVez && base.max > base.min ? base.max : cDesde.get() + 1);
  pintarModo();
  pintarIcono();
  const d = t ? diasDesde(ultimaVez(estado.historial, t.id), hoyLocal()) : null;
  ultimaOriginal = d === null || d < 0 ? NUNCA : d;
  cUltima.set(ultimaOriginal);
  borrarBtn.hidden = !t;
  reiniciarBorrar();
  armando = false;
  original = t ? firmaDe(t) : '';
  revisar();
  hojaTarea.querySelector('.hoja-cuerpo').scrollTop = 0;
  abrirHoja(hojaTarea);
}
function cerrarHojaTarea() {
  nombreTarea.blur();
  cerrarHoja(hojaIconos);
  cerrarHoja(hojaTarea);
}

nombreTarea.addEventListener('input', revisar);
// «Listo» en el teclado guarda (así anotar rápido es: «+», escribir y «Listo»)
nombreTarea.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!guardarBtn.disabled) guardarBtn.click();
});
guardarBtn.onclick = () => {
  const t = tareaDeLaHoja();
  if (!tareaValida(t)) return;
  estado = guardarTarea(estado, t);
  // la última vez cargada a mano se suma al historial con esa fecha
  if (!t.unaVez && cUltima.get() !== ultimaOriginal) {
    estado = cargarUltimaVez(estado, t.id, cUltima.get() === NUNCA ? null : cUltima.get(), hoyLocal());
    // si todavía no empezaste con las 3 de hoy, se vuelven a elegir con la fecha nueva
    estado = reelegirSiNoEmpezo(estado, hoyLocal());
  }
  guardarDatos();
  cerrarHojaTarea();
  pintarTodo();
};

// Borrar pide 2 toques: el 1.º avisa, el 2.º borra (si no, se vuelve a «Borrar tarea» a los 3 segundos).
let borrarEspera = null;
function reiniciarBorrar() {
  clearTimeout(borrarEspera);
  borrarEspera = null;
  borrarBtn.textContent = 'Borrar';
}
borrarBtn.onclick = () => {
  if (!enEdicion) return;
  if (!borrarEspera) {
    borrarBtn.textContent = '¿Borrar?';
    borrarEspera = setTimeout(reiniciarBorrar, 3000);
    return;
  }
  reiniciarBorrar();
  estado = borrarTarea(estado, enEdicion.id);
  guardarDatos();
  cerrarHojaTarea();
  pintarTodo();
};

document.getElementById('cerrar-tarea').onclick = cerrarHojaTarea;
document.getElementById('velo-tarea').onclick = cerrarHojaTarea;
document.getElementById('cerrar-iconos').onclick = () => cerrarHoja(hojaIconos);
document.getElementById('velo-iconos').onclick = () => cerrarHoja(hojaIconos);
// El «+» de la cabecera: en Hoy, anotar rápido (1 vez · hoy, con el teclado abierto); en Tareas, una tarea nueva.
document.getElementById('nueva-tarea').onclick = () => {
  if (pantallaActual === 'hoy') {
    abrirHojaTarea(null, { unaVezHoy: true });
    nombreTarea.focus();
  } else {
    abrirHojaTarea(null);
  }
};
// Hoy: la lista de lo que entra en los minutos elegidos, «Empezar» y la tarea en curso, de a 1.
// Las reglas (cuáles son las 3, qué entra, el orden) son de reglas/hoy.js; acá solo se dibuja y se guarda.

const listaHoy = document.getElementById('lista-hoy');
const empezarBtn = document.getElementById('empezar');
const minutosEl = document.getElementById('minutos');
let minutos = 20;

// La 1.ª vez del día elige las 3 de hoy (después quedan fijas hasta mañana); si les falta lugar, se completan.
function prepararDia() {
  const antes = estado;
  estado = completarLasTres(asegurarLasTres(estado, hoyLocal()), hoyLocal());
  if (estado !== antes) guardarDatos();
}

// Hoy: la lista sigue a los minutos. Muestra todo lo que entra en ese tiempo, en el orden en que se va a ofrecer
// (las de 1 vez primero; después las 3 de hoy, sin marcarlas; después lo más vencido). Lo que no entra no se muestra.
function pintarHoy() {
  const hoy = hoyLocal();
  const lista = paraOfrecer(estado, hoy);
  pintarMinutos(lista);
  const { entran } = queEntra(lista, minutos);
  listaHoy.innerHTML = entran.length
    ? '<div class="lista">' + entran.map(t => filaTarea(t, 'toca', t.unaVez ? lineaUnaVez(t, hoy) : `${t.minutos} min`)).join('') + '</div>'
    : '<p class="nada lista">Hoy no toca nada.</p>';
}

// Los minutos: los que no alcanzan para ninguna tarea van apagados; si el elegido quedó apagado,
// pasa al más chico que alcanza. Sin ninguno, «Empezar» apagado.
function pintarMinutos(lista) {
  const botones = [...minutosEl.querySelectorAll('button')];
  const posibles = minutosPosibles(lista, botones.map(b => +b.dataset.op));
  if (!posibles.includes(minutos) && posibles.length) minutos = posibles[0];
  botones.forEach(b => {
    b.disabled = !posibles.includes(+b.dataset.op);
    b.setAttribute('aria-pressed', posibles.length > 0 && +b.dataset.op === minutos);
  });
  empezarBtn.disabled = !posibles.length;
}

function pintarTodo() { prepararDia(); pintarHoy(); pintarTareas(); }

minutosEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b) return;
  minutos = +b.dataset.op;
  pintarHoy();
});

listaHoy.addEventListener('click', e => {
  const fila = e.target.closest('.fila');
  if (!fila || !e.target.closest('[data-circulo]')) return;
  const tarea = estado.tareas.find(t => t.id === fila.dataset.id);
  if (tarea) tocarCirculo(fila, tarea);
});

// ---- La tarea en curso, de a 1

const hojaCurso = document.getElementById('hoja-curso');
const curso = document.getElementById('curso');
const cuenta = document.getElementById('cuenta');
let elegidas = [], paso = 0, resultados = [];

function pintarTareaEnCurso(entrando) {
  const t = elegidas[paso];
  cuenta.textContent = `${paso + 1} de ${elegidas.length}`;
  curso.innerHTML = `
    <div class="tarea ${entrando ? 'entra' : ''}" data-estado="toca">
      <h3>${escapar(t.nombre)}</h3>
      <p class="num">${t.minutos} min</p>
      <button class="estado" data-r="hecha" aria-label="Hecha"><i>${ic(t.icono + '-fill', 'i-tarea')}${iconosEstado()}</i></button>
    </div>
    <div class="otras">
      <button class="boton-texto" data-r="a-medias">A medias</button>
      <button class="boton-texto" data-r="salteada">Saltear</button>
    </div>`;
  const tarea = curso.querySelector('.tarea');
  if (entrando) requestAnimationFrame(() => requestAnimationFrame(() => tarea.classList.remove('entra')));
  curso.querySelectorAll('[data-r]').forEach(b => { b.onclick = () => marcarEnCurso(t, b.dataset.r, tarea); });
}

function marcarEnCurso(t, r, tarea) {
  curso.querySelectorAll('[data-r]').forEach(b => { b.disabled = true; });
  const hoy = hoyLocal();
  estado = r === 'hecha' ? marcarHecha(estado, t.id, hoy) : r === 'a-medias' ? marcarAMedias(estado, t.id, hoy) : marcarSalteada(estado, t.id, hoy);
  guardarDatos();
  tarea.dataset.estado = r;
  resultados.push([t, r]);
  setTimeout(() => {
    tarea.classList.add('sale');
    setTimeout(() => {
      paso++;
      if (paso < elegidas.length) pintarTareaEnCurso(true); else pintarFin();
    }, 250);
  }, 700);
}

function pintarFin() {
  cuenta.textContent = '';
  curso.innerHTML = `
    <div class="fin">
      <h3>listo por ahora</h3>
      <div>${resultados.map(([t, r]) => filaTarea(t, r, `${t.minutos} min`)).join('')}</div>
    </div>
    <button class="boton" id="listo">Cerrar</button>`;
  document.getElementById('listo').onclick = cerrarCurso;
}

function empezar() {
  const { entran } = queEntra(paraOfrecer(estado, hoyLocal()), minutos);
  if (!entran.length) return;
  elegidas = entran; paso = 0; resultados = [];
  pintarTareaEnCurso(false);
  hojaCurso.classList.add('abierta');
}
function cerrarCurso() {
  hojaCurso.classList.remove('abierta');
  pintarTodo();
}
empezarBtn.onclick = empezar;
document.getElementById('cerrar-curso').onclick = cerrarCurso;
document.getElementById('velo-curso').onclick = cerrarCurso;
// Ajustes › copia de seguridad: bajar todo el estado a un .json y volver a cargarlo.
// En el iPhone, «Bajar copia» abre el menú de compartir (desde ahí, «Guardar en Archivos»); si no se puede, baja el archivo.

const notaCopia = document.getElementById('nota-copia');
const hojaCopia = document.getElementById('hoja-copia');
const textoCopia = document.getElementById('texto-copia');
const reemplazarBtn = document.getElementById('reemplazar');
const archivoCopia = document.getElementById('archivo-copia');
let copiaLeida = null;

function avisarCopia(texto) {
  notaCopia.textContent = texto;
  notaCopia.classList.remove('cambia'); void notaCopia.offsetWidth; notaCopia.classList.add('cambia');
}

document.getElementById('bajar-copia').onclick = async () => {
  const ahora = new Date();
  const dia = diaLocal(ahora);
  const hora = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}`;
  const archivo = new File([armarCopia(estado, dia, hora)], nombreCopia(dia), { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try {
      await navigator.share({ files: [archivo] });
      avisarCopia('Copia lista.');
    } catch (e) { /* cerraste el menú sin elegir: no pasa nada */ }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(archivo);
  a.download = archivo.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  avisarCopia('Copia bajada: ' + archivo.name);
};

document.getElementById('cargar-copia').onclick = () => archivoCopia.click();

// Leer el archivo y pedir confirmación antes de reemplazar
archivoCopia.addEventListener('change', async () => {
  const f = archivoCopia.files[0];
  archivoCopia.value = '';
  if (!f) return;
  const r = leerCopia(await f.text());
  copiaLeida = r.ok ? r.estado : null;
  if (r.ok) {
    const de = r.resumen.dia ? `Copia del ${fechaLarga(r.resumen.dia)}` : 'Copia';
    textoCopia.textContent = `${de}: ${r.resumen.tareas} tareas y ${r.resumen.hechas} hechas.`;
  } else {
    textoCopia.textContent = r.error;
  }
  reemplazarBtn.hidden = !r.ok;
  hojaCopia.classList.add('abierta');
});

function cerrarHojaCopia() { hojaCopia.classList.remove('abierta'); copiaLeida = null; }
document.getElementById('cerrar-copia').onclick = cerrarHojaCopia;
document.getElementById('velo-copia').onclick = cerrarHojaCopia;

reemplazarBtn.onclick = () => {
  if (!copiaLeida) return;
  estado = copiaLeida;
  prepararDia();
  guardarDatos();
  pintarTodo();
  cerrarHojaCopia();
  avisarCopia('Copia cargada.');
};
// Al abrir: leer los datos, pedir que no se borren, poner la fecha y dejar la app lista para usarse sin internet.
leerDatos();
prepararDia();
pintarSubtitulo();
pintarTodo();
// si la app queda abierta y cambia el día, al volver se eligen las 3 del día nuevo y se actualiza todo
document.addEventListener('visibilitychange', () => { if (!document.hidden) { prepararDia(); pintarSubtitulo(); pintarTodo(); } });

pedirQueNoSeBorren().then(si => {
  document.getElementById('persistente').textContent = si ? 'para siempre' : 'mientras haya lugar';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* sin service worker: igual funciona con internet */ });
}
</script>

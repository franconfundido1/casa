<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bocetos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<title>Bocetos · casa</title>
<link rel="stylesheet" href="sistema.css">
<style>
  .muestra { width: var(--circulo); height: var(--circulo); border-radius: 50%; margin: 0 7px; flex: none; border: var(--trazo) solid var(--linea); }
  .fila .valor svg { width: 18px; height: 18px; color: var(--texto-2); }
  a.fila { padding-left: var(--margen); }
  a.fila + a.fila::before { left: var(--margen); }
  .icono { display: flex; align-items: center; gap: var(--esp-4); padding: var(--esp-2) var(--margen) 0; }
  .icono img { width: 64px; height: 64px; border-radius: 15px; border: var(--trazo) solid var(--linea); }
  .icono p { font: var(--letra-secundaria); color: var(--texto-2); }
</style>
</head>
<body>
<header class="titulo"><div><h1>bocetos</h1><small>para mirar en el iPhone</small></div></header>

<main class="pantalla">

  <section class="seccion">
    <h2>pantallas</h2>
    <div id="pantallas"></div>
    <p class="nota">Datos de ejemplo: miércoles 18 de noviembre, 18:40. En los bocetos, la pestaña Ajustes trae acá.</p>
  </section>

  <section class="seccion">
    <h2>ícono</h2>
    <div class="icono"><img src="icono-180.png" alt=""><p>str3ak: los 3 estados del círculo (toca, a medias, hecha), blanco sobre negro.</p></div>
  </section>

  <section class="seccion">
    <h2>estados</h2>
    <div id="estados"></div>
  </section>

  <section class="seccion">
    <h2>colores</h2>
    <div id="colores"></div>
    <p class="nota">Detalle en docs/diseno.md.</p>
  </section>
</main>
<script src="boceto.js"></script>
<script>
  const pantallas = [
    ['Tablet', 'Riel, Hoy en 2 paneles, Tareas, Ajustes y la vertical', 'tablet/'],
    ['Hoy', 'Las 3 de hoy y «tengo X minutos»', 'hoy.html'],
    ['Tarea en curso', 'Hecha, a medias y saltear', 'hoy.html#curso'],
    ['Tareas', 'Las 9 de arranque', 'tareas.html'],
    ['Editar tarea', 'La hoja, con Verdulería', 'tareas.html#editar'],
    ['Logo', '3 opciones con el nombre str3ak', 'logos.html'],
  ];
  document.getElementById('pantallas').innerHTML = pantallas.map(([n, l, h]) =>
    `<a class="fila" href="${h}"><span class="texto"><span class="nombre">${n}</span><span class="linea">${l}</span></span><span class="valor">${ic('caret-right')}</span></a>`).join('');

  const estados = [
    ['Toca', 'toca'], ['No toca todavía', 'no'], ['Hecha', 'hecha'],
    ['Salteada', 'salteada'], ['A medias', 'a-medias'], ['Esperando', 'esperando'],
  ];
  document.getElementById('estados').innerHTML = estados.map(([n, e]) =>
    fila({ nombre: n, linea: 'cada 3 días · 10 min', estado: e })).join('');

  const colores = [
    ['--texto', 'Texto, lo elegido, lo que toca'], ['--texto-2', 'Texto gris, lo no elegido, la flecha de «salteada»'],
    ['--texto-3', 'Apagado'], ['--linea', 'Contornos finos y separadores'], ['--gris-lleno', 'Círculo sin hacer, el ×'],
    ['--borrar', 'Solo «Borrar tarea»'], ['--fondo', 'Fondo'],
  ];
  document.getElementById('colores').innerHTML = colores.map(([v, n]) =>
    `<div class="fila"><span class="muestra" style="background: var(${v})"></span><span class="texto"><span class="nombre">${n}</span><span class="linea">${v}</span></span></div>`).join('');

  pestanas('ajustes');
</script>
</body>
</html>

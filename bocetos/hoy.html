<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bocetos">
<link rel="manifest" href="manifest.json">
<title>Hoy · boceto</title>
<link rel="stylesheet" href="sistema.css">
<link rel="apple-touch-icon" href="icono-180.png">
<style>
  /* «Tengo X minutos»: fijo arriba de la barra de pestañas; la lista se mueve por encima */
  .tengo { flex: none; padding: var(--esp-3) var(--margen) 0; text-align: center; border-top: .5px solid var(--separador); }
  .tengo small { display: block; font: var(--letra-nota); color: var(--texto-2); }
  .tengo .cuanto { font: var(--letra-enorme); margin: var(--esp-1) 0 var(--esp-3); }
  .tengo .cuanto span { font: var(--letra-titulo-2); font-weight: 400; color: var(--texto-2); }
  .tengo .nota { font: var(--letra-nota); color: var(--texto-2); padding-top: var(--esp-2); min-height: 26px; }
  .tengo .nota:empty { min-height: var(--esp-3); }
  .tengo .nota:not(:empty) { animation: fundido var(--t-corta); }

  /* Tarea en curso */
  .curso { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 var(--margen); overflow: hidden; text-align: center; }
  .tarea { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;
    transition: transform var(--t-tarea) var(--curva-ios), opacity var(--t-tarea); }
  .tarea.sale { transform: translateX(-40%); opacity: 0; }
  .tarea.entra { transform: translateX(40%); opacity: 0; transition: none; }
  .tarea h3 { font: var(--letra-enorme); }
  .tarea p { font: var(--letra-titulo-2); font-weight: 400; color: var(--texto-2); margin-top: var(--esp-2); }
  .tarea .estado { width: auto; height: auto; margin-top: var(--esp-8); }
  .tarea .estado i { --circulo: var(--circulo-grande); border-width: 3px; }
  .tarea .estado i svg { width: 52px; height: 52px; }
  .tarea[data-estado="toca"] .estado:active i { transform: scale(.94); }
  .tarea .estado i { transition: background var(--t-corta), border-color var(--t-corta), transform 100ms; }
  .tarea .etiqueta { font: var(--letra-nota); color: var(--texto-2); margin-top: var(--esp-2); }
  .otras { display: flex; justify-content: center; gap: var(--esp-6); }
  .otras button[disabled], .tarea .estado[disabled] { pointer-events: none; }

  .fin { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; text-align: left; animation: fundido var(--t-corta); }
  .fin h3 { font: var(--letra-titulo); padding: 0 0 var(--esp-4); text-align: center; }
  .fin .fila { padding-left: 0; }
  .fin .fila + .fila::before { left: 48px; right: 0; }
  .fin .fila:active { background: none; }
  .fin .boton { margin-top: auto; }
</style>
</head>
<body>

<main class="pantalla">
  <div class="titulo">
    <small>Miércoles 18 de noviembre</small>
    <h1>Hoy</h1>
  </div>

  <section class="seccion">
    <h2>Las 3 de hoy</h2>
    <div id="las3"></div>
  </section>

  <section class="seccion">
    <h2>Esperando</h2>
    <div id="esperando"></div>
  </section>
</main>

<div class="tengo">
    <small>Tengo</small>
    <div class="cuanto num" id="cuanto"></div>
    <div class="selector" id="minutos">
      <span class="marca"></span>
      <button data-op="5">5</button>
      <button data-op="10">10</button>
      <button data-op="20">20</button>
      <button data-op="30">30</button>
      <button data-op="60">60</button>
    </div>
    <p class="nota" id="nota"></p>
    <button class="boton principal" id="empezar">Empezar</button>
</div>

<section class="hoja" id="hoja-curso" aria-label="Tarea en curso">
  <div class="hoja-arriba">
    <button class="boton-circulo" id="cerrar-curso" aria-label="Cerrar"></button>
    <h2 class="num" id="cuenta"></h2>
    <span></span>
  </div>
  <div class="curso" id="curso"></div>
</section>
<div class="velo" id="velo"></div>

<script src="boceto.js"></script>
<script>
  // Datos de docs/vision.md: miércoles 18 de noviembre, 18:40. La ropa se metió a las 18:00.
  const tareas = {
    platos:  { nombre: 'Lavar los platos', min: 10, estado: 'hecha' },
    barrer:  { nombre: 'Barrer', min: 10, estado: 'toca' },
    verdu:   { nombre: 'Verdulería', min: 20, estado: 'toca' },
    bano:    { nombre: 'Limpiar el baño', min: 20, estado: 'toca' },
    ordenar: { nombre: 'Ordenar la ropa', min: 10, estado: 'toca' },
  };
  // De la más vencida a la menos; las 3 de hoy primero.
  const orden = ['barrer', 'verdu', 'bano', 'ordenar'];

  document.getElementById('cerrar-curso').innerHTML = ic('x');

  function pintarHoy() {
    document.getElementById('las3').innerHTML = ['platos', 'barrer', 'verdu']
      .map(k => fila({ ...tareas[k], linea: `${tareas[k].min} min` })).join('');
  }
  document.getElementById('esperando').innerHTML =
    fila({ nombre: 'Colgar la ropa', linea: 'desde las 19:30', estado: 'esperando' });

  // «Tengo X minutos»: recorre las que tocan y se queda con las que entran.
  const pendientes = () => orden.filter(k => ['toca', 'a-medias'].includes(tareas[k].estado));
  function entran(minutos) {
    let queda = minutos; const lista = [];
    for (const k of pendientes()) if (tareas[k].min <= queda) { lista.push(k); queda -= tareas[k].min; }
    return lista;
  }
  let minutos = 20, elegidas = [];
  function pintarTengo() {
    const cuanto = document.getElementById('cuanto');
    cuanto.innerHTML = `${minutos} <span>min</span>`;
    cuanto.classList.remove('cambia'); void cuanto.offsetWidth; cuanto.classList.add('cambia');
    elegidas = entran(minutos);
    document.getElementById('empezar').disabled = !elegidas.length;
    const nota = document.getElementById('nota');
    if (elegidas.length) nota.textContent = '';
    else if (pendientes().length) {
      const corta = pendientes().map(k => tareas[k]).sort((a, b) => a.min - b.min)[0];
      nota.textContent = `No entra ninguna. La más corta: ${corta.nombre}, ${corta.min} min.`;
    } else nota.textContent = 'No queda nada que toque hoy.';
  }
  selector(document.getElementById('minutos'), op => { minutos = +op; pintarTengo(); }).elegir('20');

  // La tarea en curso, de a 1.
  const hoja = document.getElementById('hoja-curso');
  const curso = document.getElementById('curso');
  const cuenta = document.getElementById('cuenta');
  let paso = 0, resultados = [];

  function pintarTarea(entrando) {
    const k = elegidas[paso], t = tareas[k];
    cuenta.textContent = `${paso + 1} de ${elegidas.length}`;
    curso.innerHTML = `
      <div class="tarea ${entrando ? 'entra' : ''}" data-estado="toca">
        <h3>${t.nombre}</h3>
        <p class="num">${t.min} min</p>
        <button class="estado" data-r="hecha" aria-label="Hecha"><i>${ic('check-bold', 'i-check')}${ic('arrow-right-bold', 'i-salteada')}</i></button>
        <div class="etiqueta">Hecha</div>
      </div>
      <div class="otras">
        <button class="boton-texto" data-r="a-medias">A medias</button>
        <button class="boton-texto" data-r="salteada">Saltear</button>
      </div>`;
    const tarea = curso.querySelector('.tarea');
    if (entrando) requestAnimationFrame(() => requestAnimationFrame(() => tarea.classList.remove('entra')));
    curso.querySelectorAll('[data-r]').forEach(b => b.onclick = () => marcar(k, b.dataset.r, tarea));
  }

  const etiquetas = { 'hecha': 'Hecha', 'a-medias': 'A medias', 'salteada': 'Salteada' };
  function marcar(k, r, tarea) {
    curso.querySelectorAll('[data-r]').forEach(b => b.disabled = true);
    tarea.dataset.estado = r;
    tarea.querySelector('.etiqueta').textContent = etiquetas[r];
    resultados.push([k, r]);
    setTimeout(() => {
      tarea.classList.add('sale');
      setTimeout(() => {
        paso++;
        if (paso < elegidas.length) pintarTarea(true); else pintarFin();
      }, 250);
    }, 700);
  }

  function pintarFin() {
    cuenta.textContent = '';
    curso.innerHTML = `
      <div class="fin">
        <h3>Listo por ahora</h3>
        <div>${resultados.map(([k, r]) => fila({ nombre: tareas[k].nombre, linea: `${tareas[k].min} min`, estado: r })).join('')}</div>
      </div>
      <button class="boton principal" id="listo">Cerrar</button>`;
    document.getElementById('listo').onclick = cerrar;
  }

  function empezar() {
    if (!elegidas.length) return;
    paso = 0; resultados = [];
    pintarTarea(false);
    abrirHoja(hoja);
  }
  function cerrar() {
    resultados.forEach(([k, r]) => tareas[k].estado = r);
    resultados = [];
    pintarHoy();
    pintarTengo();
    cerrarHoja(hoja);
    history.replaceState(null, '', location.pathname);
  }
  document.getElementById('empezar').onclick = empezar;
  document.getElementById('cerrar-curso').onclick = cerrar;
  document.getElementById('velo').onclick = cerrar;

  pintarHoy();
  pintarTengo();
  pestanas('hoy');
  if (location.hash === '#curso') setTimeout(empezar, 150);
</script>
</body>
</html>

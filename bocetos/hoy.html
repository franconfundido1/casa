<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hoy · boceto</title>
<link rel="stylesheet" href="sistema.css">
<style>
  .pantalla { display: flex; flex-direction: column; }
  .tengo { margin-top: auto; padding: var(--esp-4) var(--margen) 0; }
  .tengo .nota { font: var(--letra-nota); color: var(--texto-2); text-align: center; min-height: 18px; margin: var(--esp-3) 0; }

  .curso { flex: 1; display: flex; flex-direction: column; padding: 0 var(--margen); overflow: hidden; }
  .tarea { margin-top: auto; padding-bottom: var(--esp-7); transition: transform var(--t-tarea) var(--curva-ios), opacity var(--t-tarea); }
  .tarea.sale { transform: translateX(-40%); opacity: 0; }
  .tarea.entra { transform: translateX(40%); opacity: 0; transition: none; }
  .tarea .estado { width: auto; height: auto; justify-content: start; margin-bottom: var(--esp-5); }
  .tarea .estado i { --circulo: 64px; border-width: 2.5px; }
  .tarea .estado i svg { width: 30px; height: 30px; }
  .tarea[data-estado="esperando"] .estado i .i-reloj { width: 34px; height: 34px; }
  .tarea .marca { font: var(--letra-nota); font-weight: 600; color: var(--acento); margin-bottom: var(--esp-1); }
  .tarea h3 { font: var(--letra-titulo); }
  .tarea p { font: var(--letra-secundaria); color: var(--texto-2); margin-top: var(--esp-1); }
  .tarea .resultado { font: var(--letra-encabezado); margin-top: var(--esp-3); min-height: 22px; }
  [data-estado="hecha"] .resultado { color: var(--hecha); }
  [data-estado="a-medias"] .resultado { color: var(--a-medias); }
  [data-estado="salteada"] .resultado { color: var(--texto-2); }
  .acciones { display: grid; gap: var(--esp-3); }
  .fin { margin-top: auto; padding-bottom: var(--esp-6); animation: fundido var(--t-corta); }
  .fin h3 { font: var(--letra-titulo); padding: 0 0 var(--esp-5); }
  .fin .grupo { margin: 0 0 var(--esp-6); }
  .fin .fila:active { background: none; }
</style>
</head>
<body>

<main class="pantalla">
  <div class="barra-arriba"></div>
  <div class="titulo">
    <small>Miércoles 18 de noviembre</small>
    <h1>Hoy</h1>
  </div>

  <section class="grupo">
    <h2>Las 3 de hoy</h2>
    <div class="bloque" id="las3"></div>
  </section>

  <section class="grupo">
    <h2>Esperando</h2>
    <div class="bloque" id="esperando"></div>
  </section>

  <div class="tengo">
    <div class="contador" id="minutos">
      <button data-menos aria-label="Menos"></button>
      <div class="cifra"><b class="num" data-valor></b><span>minutos</span></div>
      <button data-mas aria-label="Más"></button>
    </div>
    <p class="nota" id="entran"></p>
    <button class="boton principal" id="empezar">Empezar</button>
  </div>
</main>

<section class="hoja" id="hoja-curso" aria-label="Tarea en curso">
  <div class="hoja-arriba">
    <button class="boton-circulo" id="cerrar-curso" aria-label="Cerrar"></button>
    <h2 class="num" id="cuenta"></h2>
    <span></span>
  </div>
  <div class="curso" id="curso"></div>
</section>
<div class="velo" id="velo"></div>

<script src="boceto.js"></script>
<script>
  // Datos de docs/vision.md: miércoles 18 de noviembre, 18:40. La ropa se metió a las 18:00.
  const tareas = {
    platos:  { nombre: 'Lavar los platos', min: 10, frec: 'Todos los días', hace: 'hecha hoy', estado: 'hecha', de3: true },
    barrer:  { nombre: 'Barrer', min: 10, frec: 'Cada 3 días', hace: 'hace 5 días', estado: 'toca', de3: true },
    verdu:   { nombre: 'Verdulería', min: 20, frec: 'Cada 3 a 4 días', hace: 'hace 6 días', estado: 'toca', de3: true },
    bano:    { nombre: 'Limpiar el baño', min: 20, frec: 'Cada 7 días', hace: 'hace 8 días', estado: 'toca' },
    ordenar: { nombre: 'Ordenar la ropa', min: 10, frec: 'Cada 2 días', hace: 'hace 2 días', estado: 'toca' },
  };
  // De la más vencida a la menos; las 3 de hoy primero.
  const orden = ['barrer', 'verdu', 'bano', 'ordenar'];
  const linea = t => t.estado === 'hecha' ? `${t.frec} · ${t.min} min` : `${t.frec} · ${t.min} min · ${t.hace}`;

  document.querySelectorAll('[data-menos]').forEach(b => b.innerHTML = ic('minus'));
  document.querySelectorAll('[data-mas]').forEach(b => b.innerHTML = ic('plus'));
  document.getElementById('cerrar-curso').innerHTML = ic('x');

  function pintarHoy() {
    document.getElementById('las3').innerHTML = ['platos', 'barrer', 'verdu']
      .map(k => fila({ ...tareas[k], linea: linea(tareas[k]) })).join('');
  }
  document.getElementById('esperando').innerHTML =
    fila({ nombre: 'Colgar la ropa', linea: '10 min · desde las 19:30', estado: 'esperando' });

  // «Tengo X minutos»: recorre las que tocan y se queda con las que entran.
  function entran(minutos) {
    let queda = minutos; const lista = [];
    for (const k of orden) {
      const t = tareas[k];
      if (t.estado !== 'toca' && t.estado !== 'a-medias') continue;
      if (t.min <= queda) { lista.push(k); queda -= t.min; }
    }
    return lista;
  }
  const pendientes = () => orden.filter(k => ['toca', 'a-medias'].includes(tareas[k].estado));
  let elegidas = [];
  const minutos = contador(document.getElementById('minutos'), {
    valor: 20, min: 5, max: 120, paso: 5,
    alCambiar: v => {
      elegidas = entran(v);
      const nota = document.getElementById('entran');
      const empezar = document.getElementById('empezar');
      empezar.disabled = elegidas.length === 0;
      if (elegidas.length) nota.textContent = elegidas.length === 1 ? 'Entra 1 tarea' : `Entran ${elegidas.length} tareas`;
      else if (pendientes().length) {
        const corta = pendientes().map(k => tareas[k]).sort((a, b) => a.min - b.min)[0];
        nota.textContent = `No entra ninguna. La más corta: ${corta.nombre}, ${corta.min} min.`;
      } else nota.textContent = 'No queda nada que toque hoy.';
    },
  });

  // La tarea en curso, de a 1.
  const hoja = document.getElementById('hoja-curso');
  const curso = document.getElementById('curso');
  const cuenta = document.getElementById('cuenta');
  let paso = 0, resultados = [];

  function pintarTarea(entrando) {
    const k = elegidas[paso], t = tareas[k];
    cuenta.textContent = `${paso + 1} de ${elegidas.length}`;
    curso.innerHTML = `
      <div class="tarea ${entrando ? 'entra' : ''}" data-estado="toca">
        ${circulo()}
        ${t.de3 ? '<div class="marca">De las 3 de hoy</div>' : ''}
        <h3>${t.nombre}</h3>
        <p>${t.min} min · ${t.frec.toLowerCase()} · ${t.hace}</p>
        <div class="resultado"></div>
      </div>
      <div class="acciones">
        <button class="boton principal" data-r="hecha">Hecha</button>
        <div class="botones-lado">
          <button class="boton" data-r="a-medias">A medias</button>
          <button class="boton" data-r="salteada">Saltear</button>
        </div>
      </div>`;
    const tarea = curso.querySelector('.tarea');
    if (entrando) requestAnimationFrame(() => requestAnimationFrame(() => tarea.classList.remove('entra')));
    curso.querySelectorAll('[data-r]').forEach(b => b.onclick = () => marcar(k, b.dataset.r, tarea));
  }

  const textos = { 'hecha': 'Hecha', 'a-medias': 'A medias: mañana va primero', 'salteada': 'Salteada por hoy' };
  function marcar(k, r, tarea) {
    curso.querySelectorAll('[data-r]').forEach(b => b.disabled = true);
    tarea.dataset.estado = r;
    tarea.querySelector('.resultado').textContent = textos[r];
    resultados.push([k, r]);
    setTimeout(() => {
      tarea.classList.add('sale');
      setTimeout(() => {
        paso++;
        if (paso < elegidas.length) pintarTarea(true); else pintarFin();
      }, 250);
    }, 700);
  }

  function pintarFin() {
    cuenta.textContent = '';
    const lineas = { 'hecha': 'Hecha', 'a-medias': 'A medias', 'salteada': 'Salteada' };
    curso.innerHTML = `
      <div class="fin">
        <h3>Listo por ahora</h3>
        <section class="grupo"><div class="bloque">
          ${resultados.map(([k, r]) => fila({ nombre: tareas[k].nombre, linea: lineas[r], estado: r })).join('')}
        </div></section>
        <button class="boton principal" id="listo">Cerrar</button>
      </div>`;
    document.getElementById('listo').onclick = cerrar;
  }

  function empezar() {
    if (!elegidas.length) return;
    paso = 0; resultados = [];
    pintarTarea(false);
    abrirHoja(hoja);
  }
  function cerrar() {
    resultados.forEach(([k, r]) => tareas[k].estado = r);
    pintarHoy();
    minutos.set(minutos.get());
    cerrarHoja(hoja);
    history.replaceState(null, '', location.pathname);
  }
  document.getElementById('empezar').onclick = empezar;
  document.getElementById('cerrar-curso').onclick = cerrar;
  document.getElementById('velo').onclick = cerrar;

  pintarHoy();
  pestanas('hoy');
  if (location.hash === '#curso') setTimeout(empezar, 150);
</script>
</body>
</html>

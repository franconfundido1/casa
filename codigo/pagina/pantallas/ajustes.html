<section class="pantalla" id="pantalla-ajustes" data-titulo="ajustes" hidden>

  </div>
  <div class="seccion">
    <button class="fila-dato fila-boton" id="bajar-copia"><span>Bajar copia</span><svg class="ic" aria-hidden="true"><use href="#download-simple"/></svg></button>

    <input type="file" id="archivo-copia" accept=".json,application/json" hidden>

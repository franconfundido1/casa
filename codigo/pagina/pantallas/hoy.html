<section class="pantalla pantalla-hoy" id="pantalla-hoy" data-titulo="hoy">
  <div class="lista-hoy" id="lista-hoy"></div>
  <!-- Los minutos y «Empezar»: fijos arriba de la barra de pestañas; la lista se mueve por encima y sigue a los minutos -->
  <div class="tengo">
    <div class="opciones num" id="minutos">
      <button data-op="5">5</button>
      <button data-op="10">10</button>
      <button data-op="20" aria-pressed="true">20</button>
      <button data-op="30">30</button>
      <button data-op="60">60</button>
    </div>
    <button class="boton" id="empezar">Empezar</button>
  </div>
</section>

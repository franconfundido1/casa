# Compila la app de Android (str3ak.apk, firmada) y la sube como Release, para bajarla desde la tablet.
#
# Corre al fusionar en main algo que cambie la app (salida/, android/, capacitor.config.json o package-lock.json), y a mano:
# Actions › «App de Android» › Run workflow. Solo publica desde main.
# La versión es VERSION_APP de codigo/build.py: el Release se llama v1.2, etc. Si ya existe, se corta: subí VERSION_APP.
# Hacen falta 3 secretos (Settings › Secrets and variables › Actions), ver docs/android.md:
#   ANDROID_CLAVE (la clave .jks en base64), ANDROID_CLAVE_CONTRASENA y ANDROID_CLAVE_ALIAS.
name: App de Android

on:
  push:
    branches: [main]
    paths:
      - 'salida/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write # para crear el Release

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Chequear que se corra desde main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se publica desde la rama main (elegiste ${GITHUB_REF_NAME})."
            exit 1
          fi

      - name: Chequear que estén los secretos
        env:
          ANDROID_CLAVE: ${{ secrets.ANDROID_CLAVE }}
          ANDROID_CLAVE_CONTRASENA: ${{ secrets.ANDROID_CLAVE_CONTRASENA }}
          ANDROID_CLAVE_ALIAS: ${{ secrets.ANDROID_CLAVE_ALIAS }}
        run: |
          for s in ANDROID_CLAVE ANDROID_CLAVE_CONTRASENA ANDROID_CLAVE_ALIAS; do
            if [ -z "${!s}" ]; then echo "::error::Falta el secreto $s (ver docs/android.md)."; exit 1; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Leer la versión
        id: version
        run: |
          v=$(sed -n "s/^VERSION_APP = '\([0-9.]*\)'$/\1/p" codigo/build.py)
          if [ -z "$v" ]; then echo "::error::No encuentro VERSION_APP en codigo/build.py."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versión $v"

      - name: Chequear que la versión sea nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Ya existe el Release v${{ steps.version.outputs.version }}: subí VERSION_APP en codigo/build.py."
            exit 1
          fi

      - name: Compilar la página y chequear que salida/ coincida con lo commiteado
        run: |
          python3 codigo/build.py
          if [ -n "$(git status --porcelain -- salida/)" ]; then
            echo "::error::salida/ no coincide con lo commiteado: compilá (python3 codigo/build.py) y commiteá salida/."
            git status --short -- salida/
            exit 1
          fi

      - name: Copiar la página a la app
        run: |
          npm ci
          npx cap sync android

      - name: Compilar el APK firmado
        env:
          ANDROID_CLAVE: ${{ secrets.ANDROID_CLAVE }}
          FIRMA_CLAVE: ${{ secrets.ANDROID_CLAVE_CONTRASENA }}
          FIRMA_ALIAS: ${{ secrets.ANDROID_CLAVE_ALIAS }}
        run: |
          echo "$ANDROID_CLAVE" | base64 --decode > android/app/str3ak.jks
          export JAVA_HOME="$JAVA_HOME_21_X64"
          cd android
          ./gradlew assembleRelease --no-daemon
          rm app/str3ak.jks
          cp app/build/outputs/apk/release/app-release.apk ../str3ak.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../str3ak.apk | head -2

      # el archivo se llama siempre str3ak.apk: así el enlace …/releases/latest/download/str3ak.apk baja siempre la última
      - name: Subir el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.version.outputs.version }}"
          gh release create "$v" str3ak.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "str3ak $v" \
            --notes "Para instalarla o actualizarla en la tablet: docs/android.md."
